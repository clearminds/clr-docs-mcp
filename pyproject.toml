[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clr-docs-mcp"
version = "0.1.0"
description = "Read-only MCP for the clearminds Zensical docs site (clearminds/docs)"
authors = [{name = "clearminds", email = "noc@clearminds.se"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.14.0,<3",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
clr-docs-mcp = "clr_docs_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clr_docs_mcp"]
